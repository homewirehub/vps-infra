#!/usr/sbin/nft -f
# Baseline ruleset for a single-purpose server.
#
# Scoped replace instead of a global "flush ruleset": tailscaled installs its
# own tables at runtime, and flushing everything would silently drop them on
# every reload, breaking tailnet connectivity until the daemon rebuilt them.
# Creating the table first makes the delete safe when it does not exist yet.
table inet filter
delete table inet filter

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    iif lo accept

    # Tailnet traffic is trusted - peers are authenticated by Tailscale itself.
    iifname "tailscale0" accept

    ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept
    ip6 nexthdr icmpv6 accept

    tcp dport 22 ct state new accept

    # Allows direct peer-to-peer connections instead of relaying everything
    # through a DERP server. Harmless if unused.
    udp dport 41641 accept

    limit rate 5/minute log prefix "nft-drop: "
  }

  chain forward {
    # A drop policy here is not private to this table. Every chain hooked at
    # forward is traversed, and a drop anywhere ends the packet - so a bare
    # "policy drop" silently kills all Docker container networking, even
    # though Docker's own rules in table ip filter would accept it.
    # Verified: with no exceptions below, a container cannot reach the
    # internet at all.
    #
    # Default-deny is still worth keeping: this host is not a router, and
    # anything that is not Docker has no business being forwarded. Docker's
    # own DOCKER-USER and isolation chains keep filtering as usual, so these
    # accepts do not weaken container isolation.
    type filter hook forward priority filter; policy drop;

    ct state established,related accept
    # docker0 is the default bridge; Compose creates br-<id> per network.
    iifname { "docker0", "br-*" } accept
    oifname { "docker0", "br-*" } accept

    # Tailscale subnet routes and exit-node mode would need tailscale0 added
    # here. Neither is enabled, so forwarding for the tailnet stays closed.
  }
  chain output  { type filter hook output  priority filter; policy accept; }
}
